<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha To-Do List - Projeto Integrador</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input[type="text"] { width: 75%; padding: 8px; }
        button { padding: 8px 15px; background: #28a745; color: white; border: none; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .delete { color: red; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Lista de Tarefas (To-Do List)</h2>
        <form method="POST">
            <input type="text" name="titulo" placeholder="Digite uma nova tarefa..." required>
            <button type="submit">Adicionar</button>
        </form>
        <ul>
            {% for tarefa in tarefas %}
                <li>
                    <span>{{ tarefa[1] }}</span>
                    <a class="delete" href="/deletar/{{ tarefa[0] }}">Excluir</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
